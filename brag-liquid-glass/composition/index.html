<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Bacom — Liquid Glass</title>
  <script src="assets/gsap.min.js"></script>
  <script src="assets/liquid-glass.js"></script>
  <script src="assets/glass-sculpture.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a}
    body{font-family:system-ui,sans-serif;color:#f7f9fa}
    #main{position:relative;width:100%;height:100%;overflow:hidden;background:#0a0a0a}
    #showcase{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .illumination{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(ellipse 620px 290px at 85% 91%,#72c9ff21,transparent 75%),radial-gradient(ellipse 430px 260px at 18% 88%,#aaa5ff28,transparent 75%);opacity:.7}
    #light-trace{position:absolute;width:680px;height:3px;left:80px;top:800px;background:linear-gradient(90deg,transparent,#bddbff80,transparent);opacity:0;transform-origin:center}
    #sculpture{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    .optical{position:absolute;pointer-events:none;border:1px solid #ffffff20;border-radius:999px;background:linear-gradient(155deg,#ffffff0f,#b3b3b30f);box-shadow:0 22px 52px #00000035,inset 0 1px 0 #ffffffa6,inset 1px 0 0 #ffffff38,inset 0 -1px 0 #ffffff20;backdrop-filter:blur(3px) saturate(125%);-webkit-backdrop-filter:blur(3px) saturate(125%);opacity:0}
    .blade{width:2300px;height:142px;left:-190px;top:450px;transform-origin:50% 50%;box-shadow:0 30px 55px #0000002b,inset 0 2px 0 #ffffffb8,inset 0 0 0 2px #e7e9ee38,inset 0 -2px 0 #ffffff40}
    #blade-b{height:80px;top:505px}
    #hero-lens{left:1200px;top:190px;width:480px;height:220px}
    #orbit-a{left:180px;top:828px;width:260px;height:100px}
    #orbit-b{left:570px;top:846px;width:148px;height:100px}
    #frame-top{left:850px;top:330px;width:440px;height:20px;border-radius:10px;box-shadow:inset 0 1px 0 #ffffffe0,inset 0 -1px 0 #aebeff70,0 6px 25px #b9d0ff15}
    #signature{position:absolute;left:843px;top:1000px;width:234px;height:44px;border:1px solid #ffffff24;border-radius:24px;background:#1f1f20c9;box-shadow:inset 0 1px 0 #ffffff6b;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:2.2px;font-weight:600;color:#e7e9ee;opacity:0}
    @media(prefers-reduced-transparency:reduce){.optical{background:#caccd54d;backdrop-filter:blur(6px)!important}}
    @media(prefers-contrast:more){#signature{background:#1f1f20;color:#fefefe}}
  </style>
</head>
<body>
  <div data-hf-id="hf-kf3y" id="main" data-composition-id="main" data-duration="18" data-width="1920" data-height="1080">
    <video data-hf-id="hf-48ep" id="showcase" class="clip" data-start="0" data-duration="18" data-track-index="1" src="assets/showcase-v2.mp4" muted playsinline preload="auto"></video>
    <div data-hf-id="hf-9hc5" class="illumination"></div>
    <div data-hf-id="hf-lglr" id="light-trace"></div>
    <!-- This optical sculpture deliberately crosses the frame edges. -->
    <canvas data-hf-id="hf-h7rw" id="sculpture" aria-hidden="true" data-layout-allow-overflow></canvas>
    <div data-hf-id="hf-43n6" id="frame-top" class="optical" data-glass-strength=".45"></div>
    <div data-hf-id="hf-yzr4" id="hero-lens" class="optical" data-glass-strength=".72" data-glass-warp="true"></div>
    <div data-hf-id="hf-z0me" id="orbit-a" class="optical" data-glass-strength=".8"></div>
    <div data-hf-id="hf-v2id" id="orbit-b" class="optical" data-glass-strength=".8"></div>
    <div data-hf-id="hf-wofd" id="blade-a" class="optical blade" data-glass-strength=".85" data-glass-warp="true"></div>
    <div data-hf-id="hf-0mje" id="blade-b" class="optical blade" data-glass-strength=".85" data-glass-warp="true"></div>
    <div data-hf-id="hf-f996" id="signature">LIQUID GLASS / BACOM</div>
    <audio data-hf-id="hf-w2j2" id="original-score" class="clip" data-start="0" data-duration="18" data-track-index="8" src="assets/original-score.wav" data-volume="1"></audio>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    async function buildFilm(){
      await document.fonts.ready;
      window.__glass=await window.prepareLiquidGlass(document.querySelectorAll('.optical'));
      const sculpture=window.createGlassSculpture(document.getElementById('sculpture'));
      const clock={t:0};
      const tl=gsap.timeline({paused:true});
      tl.to(clock,{t:18,duration:18,ease:'none',onUpdate:()=>sculpture.render(clock.t)},0);
      const appear=(id,from,to,t)=>tl.fromTo(id,{opacity:0,...from},{opacity:1,...to,immediateRender:false},t);
      appear('#hero-lens',{x:210,y:470,rotation:-52,scale:.55},{x:0,y:0,rotation:-12,scale:1,duration:1.05,ease:'power3.out'},.04);
      tl.to('#hero-lens',{x:215,y:-100,rotation:16,scale:.75,opacity:0,duration:.6,ease:'power3.in'},1.48);
      // Optical wipes cross the editorial cuts, then leave the feature holds clear.
      function liquidWipe(t,reverse=false){
        const direction=reverse?-1:1;
        tl.fromTo('#blade-a',{x:-2600*direction,y:160*direction,rotation:-24*direction,opacity:0},{x:-650*direction,y:0,rotation:-24*direction,opacity:.92,duration:.33,ease:'power2.in',immediateRender:false},t);
        tl.to('#blade-a',{x:2600*direction,y:-160*direction,opacity:0,duration:.5,ease:'power3.out'},t+.33);
        tl.fromTo('#blade-b',{x:-2850*direction,y:160*direction,rotation:-24*direction,opacity:0},{x:-660*direction,y:0,rotation:-24*direction,opacity:.65,duration:.37,ease:'power2.in',immediateRender:false},t+.08);
        tl.to('#blade-b',{x:2800*direction,y:-180*direction,opacity:0,duration:.48,ease:'power3.out'},t+.45);
      }
      liquidWipe(1.93);liquidWipe(6.38,true);liquidWipe(10.9);liquidWipe(12.88,true);liquidWipe(14.97);
      appear('#frame-top',{scaleX:.2,x:320},{scaleX:1,x:0,duration:.7,ease:'power3.out'},3.08);
      tl.to('#frame-top',{opacity:0,scaleX:.6,duration:.32,ease:'power2.in'},6.25);
      appear('#orbit-a',{x:-250,y:100,rotation:-28,scale:.6},{x:0,y:0,rotation:-7,scale:1,duration:.8,ease:'power3.out'},3.65);
      appear('#orbit-b',{x:240,y:-30,rotation:24,scale:.6},{x:0,y:0,rotation:8,scale:1,duration:.8,ease:'power3.out'},3.78);
      tl.to('#orbit-a',{x:50,y:14,rotation:5,duration:2.6,ease:'sine.inOut'},4.5);
      tl.to('#orbit-b',{x:-20,y:-12,rotation:-10,duration:2.6,ease:'sine.inOut'},4.5);
      // Related droplets converge on Copy and separate when usage is confirmed.
      tl.to('#orbit-a',{x:80,y:0,scaleX:1.25,rotation:0,duration:.42,ease:'power3.inOut'},8.55);
      tl.to('#orbit-b',{x:-145,y:-18,scaleX:.86,rotation:0,duration:.42,ease:'power3.inOut'},8.55);
      tl.to('#orbit-b',{opacity:0,duration:.18,ease:'power1.out'},8.78);
      tl.to('#orbit-b',{x:-10,y:18,scaleX:1,rotation:12,duration:.55,ease:'back.out(1.2)'},9.79);
      tl.to('#orbit-b',{opacity:1,duration:.25,ease:'power1.in'},9.96);
      tl.to('#orbit-a',{x:20,y:-8,scaleX:1,rotation:-9,duration:.55,ease:'power3.out'},9.79);
      tl.to('#orbit-a,#orbit-b',{y:150,opacity:0,scale:.6,duration:.42,ease:'power3.in'},10.65);
      appear('#light-trace',{x:-700,rotation:-12},{x:0,rotation:6,duration:.65,ease:'power3.out'},11.6);
      tl.to('#light-trace',{x:850,rotation:16,opacity:0,duration:1.1,ease:'power2.inOut'},12.3);
      appear('#signature',{y:22,scale:.88},{y:0,scale:1,duration:.48,ease:'power3.out'},16.6);
      sculpture.render(0);
      window.__timelines.main=tl;
    }
    buildFilm();
  </script>
</body>
</html>
